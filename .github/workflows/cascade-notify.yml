name: Cascade notify

# Sends an `upstream-updated` repository dispatch to every consumer named in the
# caller's `.github/consumers.json` plus its `CASCADE_CONSUMERS` repository
# variable, with one App token per recipient so a bad recipient can never read or
# write any other repo.
#
# Recipients: `.github/consumers.json` may be absent or empty; `CASCADE_CONSUMERS`
# is a JSON array of `noamsto/<repo>` strings for private recipients that cannot
# be named in a committed file. Recipient names are kept out of job names and log
# lines; only the count is logged.
#
# Trust: the caller decides when this runs. When the caller wires it to
# `workflow_run`, this workflow re-checks that the run succeeded on `main` from a
# `push` when the `rev` input is the triggering run's own head sha; a `rev` that
# differs is trusted as the caller's bot landing a new commit. Otherwise it
# refuses to send. Any other triggering event is trusted to the caller.
#
# Permissions: the caller must grant `contents: read` (the recipients job
# sparse-checks out `.github/consumers.json` at `rev`). The notify job asks for no
# `GITHUB_TOKEN` permissions of its own; each dispatch uses a per-recipient App
# token scoped to that one repository with `contents: write` only.
#
# Secret: pass `CASCADE_APP_PRIVATE_KEY` and set `vars.CASCADE_APP_ID`. Map the
# secret explicitly under `secrets:` (recommended), or use `secrets: inherit`.
on:
  workflow_call:
    inputs:
      rev:
        description: 40-hex commit on main whose CI passed
        type: string
        required: true
    secrets:
      CASCADE_APP_PRIVATE_KEY:
        description: Private key for the GitHub App named by CASCADE_APP_ID
        required: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  recipients:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      repos: ${{ steps.consumers.outputs.repos }}
      indexes: ${{ steps.consumers.outputs.indexes }}
      count: ${{ steps.consumers.outputs.count }}
    steps:
      - name: Check trigger
        id: trigger
        env:
          REV: ${{ inputs.rev }}
          EVENT_NAME: ${{ github.event_name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -u

          if [[ ! "$REV" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::rev must be a 40-hex commit sha"
            exit 1
          fi

          send=true
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$REV" != "$WR_SHA" ]; then
              echo "::notice::rev differs from the triggering run's head sha; trusting the caller (bot landing)"
            elif [ "$WR_CONCLUSION" != "success" ] \
              || [ "$WR_BRANCH" != "main" ] \
              || [ "$WR_EVENT" != "push" ]; then
              echo "::notice::ignoring workflow_run ($WR_BRANCH/$WR_EVENT/$WR_CONCLUSION): not a green push to main"
              send=false
            fi
          fi

          echo "send=$send" >> "$GITHUB_OUTPUT"

      - name: Check out consumers file
        if: steps.trigger.outputs.send == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.rev }}
          sparse-checkout: .github/consumers.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read consumers
        id: consumers
        env:
          SEND: ${{ steps.trigger.outputs.send }}
          CONSUMERS_VAR: ${{ vars.CASCADE_CONSUMERS }}
        run: |
          set -u

          if [ "$SEND" != "true" ]; then
            {
              echo "repos=[]"
              echo "indexes=[]"
              echo "count=0"
            } >> "$GITHUB_OUTPUT"
            echo "nothing to send"
            exit 0
          fi

          file_repos='[]'
          if [ -f .github/consumers.json ]; then
            if ! jq -ce '
              type == "array"
              and all(.[]; type == "string" and test("^noamsto/[A-Za-z0-9._-]+$") and (test("^noamsto/[.]+$") | not))
            ' .github/consumers.json > /dev/null; then
              echo "::error::.github/consumers.json must be an array of noamsto/<repo> strings"
              exit 1
            fi
            file_repos=$(jq -c '[.[] | ltrimstr("noamsto/")]' .github/consumers.json)
          fi

          consumers_var="${CONSUMERS_VAR:-}"
          var_repos='[]'
          if [ -n "${consumers_var//[[:space:]]/}" ]; then
            if ! jq -ce '
              type == "array"
              and all(.[]; type == "string" and test("^noamsto/[A-Za-z0-9._-]+$") and (test("^noamsto/[.]+$") | not))
            ' <<<"$consumers_var" > /dev/null 2>&1; then
              echo "::error::CASCADE_CONSUMERS must be a JSON array of noamsto/<repo> strings"
              exit 1
            fi
            var_repos=$(jq -c '[.[] | ltrimstr("noamsto/")]' <<<"$consumers_var")
          fi

          repos=$(jq -cn --argjson f "$file_repos" --argjson v "$var_repos" '$f + $v | unique')
          count=$(jq -c 'length' <<<"$repos")
          indexes=$(jq -c '[range(length)]' <<<"$repos")
          {
            echo "repos=$repos"
            echo "indexes=$indexes"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"
          echo "notifying $count consumer(s)"

  notify:
    needs: recipients
    if: needs.recipients.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.recipients.outputs.indexes) }}
    steps:
      - name: Require App id and key
        env:
          APP_ID: ${{ vars.CASCADE_APP_ID }}
          APP_KEY: ${{ secrets.CASCADE_APP_PRIVATE_KEY }}
        run: |
          set -u

          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::set the CASCADE_APP_ID variable and the CASCADE_APP_PRIVATE_KEY secret"
            exit 1
          fi

      - name: Mask recipient
        env:
          RECIPIENT: ${{ fromJSON(needs.recipients.outputs.repos)[matrix.index] }}
        run: |
          echo "::add-mask::$RECIPIENT"

      - name: Mint recipient App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CASCADE_APP_ID }}
          private-key: ${{ secrets.CASCADE_APP_PRIVATE_KEY }}
          owner: noamsto
          repositories: ${{ fromJSON(needs.recipients.outputs.repos)[matrix.index] }}
          permission-contents: write

      - name: Send upstream-updated
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RECIPIENT: ${{ fromJSON(needs.recipients.outputs.repos)[matrix.index] }}
          INDEX: ${{ matrix.index }}
          REV: ${{ inputs.rev }}
          DISPATCH_BODY: '{event_type: "upstream-updated", client_payload: {source: $source, rev: $rev}}'
        run: |
          set -u

          jq -n --arg source "$GITHUB_REPOSITORY" --arg rev "$REV" "$DISPATCH_BODY" \
            | gh api --method POST "repos/noamsto/$RECIPIENT/dispatches" --input -
          echo "sent upstream-updated to recipient #$INDEX (rev $REV)"
